<head>
    <title> Enregistrement</title>

</head>

<body>
    <main class="main">
        <div class="content">
            <app-en-tete></app-en-tete>
        </div>
        <div class="divider"></div>
        <div class="menu">
            <nav>
                <div class="animBouton">
                    <a routerLink="/leCarnet" routerLinkActive="active" ariaCurrentWhenActive="page">Voir mon Carnet</a>
                </div>
            </nav>
        </div>
        <div class="EnBas">

            <div class="historique">
                @for (bird of birdService.birds().slice(-4); track bird._id; let i = $index) {
                <div class="slider">
                    <app-historique [bird]="bird"></app-historique>
                </div>
                } @empty {
                <p>Aucun historique</p>
                }
            </div>

            <app-formulaire></app-formulaire>
        </div>
    </main>
</body>
